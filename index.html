<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>전통 뽀모도로 타이머</title>

<!-- PWA -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0a0f28">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="뽀모도로">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" href="./favicon.png">

<style>

  @font-face {
    font-family: 'KoPubWorldBatang';
    src: url('./KoPubWorld_Batang_Bold.ttf') format('truetype');
    font-weight: bold;
    font-style: normal;
  }

  :root {
    --bg-image: url('./bg-light.png');
    --page-bg: #1a1a1a;
    --accent: #f5d061;
    --accent-dim: #c9a961;
    --timer-color: #f5d061;
    --text-shadow: var(--text-shadow);
  }

  body.dark-mode {
    --bg-image: url('./bg-dark.png');
    --page-bg: #0a0f28;
    --accent: #ffd86b;
    --accent-dim: #d9b878;
    --timer-color: #ffd86b;
    --text-shadow: 0 0 18px rgba(255, 216, 107, 0.75);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: var(--page-bg);
    transition: background 0.4s ease;
    font-family: 'KoPubWorldBatang', 'Gowun Batang', 'Noto Serif KR', serif;
  }

  /* 프레임: 세로/가로 모든 뷰포트에 대응.
     높이 기준으로 세로 전체를 채우되, 가로폭이 좁으면 가로 기준으로 제한 */
  .frame {
    position: relative;
    height: min(100dvh, 179vw); /* 1376/768 ≈ 1.79 */
    aspect-ratio: 768 / 1376;
    background-image: var(--bg-image);
    background-size: 100% 100%;
    background-repeat: no-repeat;
    user-select: none;
    container-type: inline-size;
  }

  /* 타이머 텍스트 — 원형 프레임 실제 중심 y=38.5% */
  .timer-display {
    position: absolute;
    top: 38.5%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: var(--timer-color);
    font-size: 14cqw;
    font-weight: 700;
    letter-spacing: 2px;
    text-shadow: 0 0 15px rgba(245, 208, 97, 0.6);
    font-family: 'KoPubWorldBatang', 'Courier New', monospace;
  }

  .mode-label {
    position: absolute;
    top: 30%;
    left: 50%;
    transform: translateX(-50%);
    color: #f5d061;
    font-size: 4.5cqw;
    letter-spacing: 4px;
    opacity: 0.85;
  }

  .session-count {
    position: absolute;
    top: 47%;
    left: 50%;
    transform: translateX(-50%);
    color: #c9a961;
    font-size: 3.5cqw;
    opacity: 0.8;
  }

  /* 재생/일시정지/리셋 버튼 — 실측: y 55.9%~68.2% */
  .btn {
    position: absolute;
    top: 55.9%;
    width: 18.5%;
    height: 12.3%;
    background: transparent;
    border: none;
    cursor: pointer;
    transition: transform 0.15s ease;
  }

  .btn:hover { transform: scale(1.05); }
  .btn:active { transform: scale(0.95); }

  .btn-play { left: 15.5%; }
  .btn-pause { left: 40.5%; }
  .btn-reset { left: 65.5%; }

  /* 활성 상태 표시 */
  .btn.active::after {
    content: '';
    position: absolute;
    inset: 0;
    box-shadow: 0 0 20px rgba(245, 208, 97, 0.8);
    border-radius: 8px;
    pointer-events: none;
  }

  /* 진행 바 오버레이 — 매화 가지 부분 실측 y=77.2%~82.7% */
  .progress-track {
    position: absolute;
    top: 77.2%;
    left: 13%;
    width: 74%;
    height: 5.5%;
    overflow: hidden;
    border-radius: 4px;
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg,
      rgba(245, 208, 97, 0.0),
      rgba(245, 208, 97, 0.5));
    transition: width 1s linear;
  }

  /* 하단 메뉴 버튼들 실측 y=87.8%~91.1% */
  .menu-btn {
    position: absolute;
    top: 86%;
    width: 18%;
    height: 7%;
    background: transparent;
    border: none;
    cursor: pointer;
  }

  .menu-home { left: 18%; }
  .menu-settings { left: 41%; }
  .menu-stats { left: 64%; }

  /* 설정 모달 */
  .modal {
    position: absolute;
    inset: 0;
    background: rgba(10, 15, 40, 0.95);
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 20px;
    padding: 30px;
    z-index: 10;
  }

  .modal.show { display: flex; }

  .modal h2 {
    color: #f5d061;
    font-size: clamp(1.2rem, 4vw, 1.8rem);
    margin-bottom: 10px;
    letter-spacing: 3px;
  }

  .setting-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    color: #f5d061;
    font-size: clamp(0.8rem, 3vw, 1rem);
  }

  .setting-row input {
    width: 70px;
    padding: 6px;
    background: rgba(245, 208, 97, 0.1);
    border: 1px solid #f5d061;
    color: #f5d061;
    font-size: 1rem;
    text-align: center;
    border-radius: 4px;
  }

  .modal-close {
    padding: 10px 30px;
    background: #f5d061;
    color: #0a0f28;
    border: none;
    font-weight: 700;
    cursor: pointer;
    border-radius: 4px;
    letter-spacing: 2px;
    margin-top: 15px;
  }

  /* 다크모드 토글 - 족두리 클릭 영역 */
  .theme-toggle {
    position: absolute;
    top: 4%;
    left: 50%;
    transform: translateX(-50%);
    width: 20%;
    height: 15%;
    background: transparent;
    border: none;
    cursor: pointer;
    z-index: 5;
    transition: filter 0.25s ease, transform 0.25s ease;
    padding: 0;
  }

  .theme-toggle:hover {
    filter: drop-shadow(0 0 12px var(--accent)) brightness(1.15);
  }

  .theme-toggle:active {
    transform: translateX(-50%) scale(0.92);
  }

  /* 테마 전환 시 짧은 반짝임 효과 */
  .theme-toggle.flash {
    animation: jokduriFlash 0.5s ease;
  }

  @keyframes jokduriFlash {
    0%, 100% { filter: none; }
    50% { filter: drop-shadow(0 0 20px var(--accent)) brightness(1.4); }
  }

  /* 프리셋 버튼 */
  .preset-btn {
    width: 100%;
    padding: 12px;
    background: rgba(245, 208, 97, 0.08);
    border: 1px solid rgba(245, 208, 97, 0.3);
    color: #f5d061;
    cursor: pointer;
    border-radius: 4px;
    text-align: left;
    transition: all 0.2s ease;
    font-family: inherit;
  }

  .preset-btn:hover, .preset-btn.active {
    background: rgba(245, 208, 97, 0.2);
    border-color: #f5d061;
    transform: translateX(4px);
  }

  .preset-title {
    font-size: clamp(0.9rem, 3.2vw, 1.1rem);
    font-weight: 700;
    letter-spacing: 2px;
    margin-bottom: 4px;
  }

  .preset-detail {
    font-size: clamp(0.7rem, 2.3vw, 0.85rem);
    color: #c9a961;
    opacity: 0.85;
  }

  /* 통계 표시 */
  .stats-display {
    position: absolute;
    bottom: 3%;
    left: 50%;
    transform: translateX(-50%);
    color: #c9a961;
    font-size: clamp(0.7rem, 2vw, 0.85rem);
    opacity: 0.7;
    text-align: center;
  }
</style>
</head>
<body>
  <div class="frame">
    <div class="mode-label" id="modeLabel">집중</div>
    <div class="timer-display" id="timer">25:00</div>
    <div class="session-count" id="sessionCount">세션 0 / 4</div>

    <!-- 다크모드 토글 - 족두리(상단 중앙 왕관) -->
    <button class="theme-toggle" id="themeToggle" title="테마 전환" aria-label="테마 전환"></button>

    <button class="btn btn-play" id="btnPlay" title="시작"></button>
    <button class="btn btn-pause" id="btnPause" title="일시정지"></button>
    <button class="btn btn-reset" id="btnReset" title="리셋"></button>

    <div class="progress-track">
      <div class="progress-fill" id="progress"></div>
    </div>

    <button class="menu-btn menu-home" id="menuHome" title="홈"></button>
    <button class="menu-btn menu-settings" id="menuSettings" title="설정"></button>
    <button class="menu-btn menu-stats" id="menuStats" title="통계"></button>

    <!-- 설정 모달 -->
    <div class="modal" id="settingsModal">
      <h2>設 定</h2>
      <div class="setting-row">
        <span>집중 시간 (분)</span>
        <input type="number" id="focusMin" value="25" min="1" max="60">
      </div>
      <div class="setting-row">
        <span>짧은 휴식 (분)</span>
        <input type="number" id="shortMin" value="5" min="1" max="30">
      </div>
      <div class="setting-row">
        <span>긴 휴식 (분)</span>
        <input type="number" id="longMin" value="15" min="1" max="60">
      </div>
      <div class="setting-row">
        <span>종소리</span>
        <select id="bellType" style="padding:6px; background:rgba(245,208,97,0.1); border:1px solid #f5d061; color:#f5d061; border-radius:4px; font-size:0.9rem;">
          <option value="temple">사찰 종</option>
          <option value="moktak">목탁</option>
          <option value="bowl">싱잉볼</option>
          <option value="bell">풍경</option>
          <option value="beep">전자음</option>
        </select>
      </div>
      <button class="modal-close" id="testBell" style="background:transparent; color:#f5d061; border:1px solid #f5d061; margin-top:5px;">소리 듣기</button>
      <button class="modal-close" id="closeSettings">확인</button>
    </div>

    <!-- 통계 모달 -->
    <div class="modal" id="statsModal">
      <h2>統 計</h2>
      <div class="setting-row">
        <span>오늘 완료한 뽀모도로</span>
        <span id="todayCount" style="font-size: 1.5rem;">0</span>
      </div>
      <div class="setting-row">
        <span>총 집중 시간 (분)</span>
        <span id="totalMinutes" style="font-size: 1.5rem;">0</span>
      </div>
      <div style="width:100%; margin-top:10px;">
        <div style="color:#f5d061; font-size:0.85rem; margin-bottom:8px; letter-spacing:2px;">최근 7일</div>
        <canvas id="weekChart" style="width:100%; height:140px; background:rgba(245,208,97,0.05); border-radius:4px;"></canvas>
      </div>
      <button class="modal-close" id="closeStats">확인</button>
    </div>

    <!-- 프리셋 모달 -->
    <div class="modal" id="presetModal">
      <h2>時 間</h2>
      <div style="color:#c9a961; font-size:0.85rem; margin-bottom:5px; text-align:center;">원하는 시간 구성을 선택하세요</div>
      <button class="preset-btn" data-focus="25" data-short="5" data-long="15">
        <div class="preset-title">클래식 뽀모도로</div>
        <div class="preset-detail">집중 25분 · 휴식 5분 · 긴휴식 15분</div>
      </button>
      <button class="preset-btn" data-focus="50" data-short="10" data-long="30">
        <div class="preset-title">딥 워크</div>
        <div class="preset-detail">집중 50분 · 휴식 10분 · 긴휴식 30분</div>
      </button>
      <button class="preset-btn" data-focus="15" data-short="3" data-long="10">
        <div class="preset-title">짧은 집중</div>
        <div class="preset-detail">집중 15분 · 휴식 3분 · 긴휴식 10분</div>
      </button>
      <button class="preset-btn" data-focus="90" data-short="20" data-long="30">
        <div class="preset-title">울트라디안</div>
        <div class="preset-detail">집중 90분 · 휴식 20분 · 긴휴식 30분</div>
      </button>
      <button class="preset-btn" data-focus="45" data-short="15" data-long="30">
        <div class="preset-title">학습 모드</div>
        <div class="preset-detail">집중 45분 · 휴식 15분 · 긴휴식 30분</div>
      </button>
      <button class="modal-close" id="closePreset">닫기</button>
    </div>
  </div>

<script>

  // 스토리지 — 일반 브라우저(localStorage) 환경 호환
  if (!window.storage) {
    window.storage = {
      async get(key) {
        const v = localStorage.getItem(key);
        return v === null ? null : { key, value: v };
      },
      async set(key, value) {
        localStorage.setItem(key, value);
        return { key, value };
      },
      async delete(key) {
        localStorage.removeItem(key);
        return { key, deleted: true };
      }
    };
  }


  // 설정
  let focusTime = 25 * 60;
  let shortBreak = 5 * 60;
  let longBreak = 15 * 60;

  // 상태
  let currentTime = focusTime;
  let totalTime = focusTime;
  let isRunning = false;
  let intervalId = null;
  let mode = 'focus'; // 'focus' | 'short' | 'long'
  let completedSessions = 0;
  let totalCompletedMinutes = 0;

  // 엘리먼트
  const timerEl = document.getElementById('timer');
  const modeLabel = document.getElementById('modeLabel');
  const sessionCount = document.getElementById('sessionCount');
  const progressEl = document.getElementById('progress');
  const btnPlay = document.getElementById('btnPlay');
  const btnPause = document.getElementById('btnPause');
  const btnReset = document.getElementById('btnReset');

  // 타이머 표시
  function updateDisplay() {
    const min = Math.floor(currentTime / 60);
    const sec = currentTime % 60;
    timerEl.textContent = `${String(min).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
    const pct = ((totalTime - currentTime) / totalTime) * 100;
    progressEl.style.width = `${pct}%`;
  }

  function updateModeLabel() {
    modeLabel.textContent =
      mode === 'focus' ? '집 중' :
      mode === 'short' ? '짧은 휴식' : '긴 휴식';
    sessionCount.textContent = `세션 ${completedSessions % 4} / 4`;
  }

  // 타이머 로직
  function startTimer() {
    if (isRunning) return;
    isRunning = true;
    btnPlay.classList.add('active');
    btnPause.classList.remove('active');

    intervalId = setInterval(() => {
      currentTime--;
      if (currentTime <= 0) {
        completeSession();
      }
      updateDisplay();
    }, 1000);
  }

  function pauseTimer() {
    isRunning = false;
    clearInterval(intervalId);
    btnPlay.classList.remove('active');
    btnPause.classList.add('active');
  }

  function resetTimer() {
    pauseTimer();
    btnPause.classList.remove('active');
    currentTime = totalTime;
    updateDisplay();
  }

  function completeSession() {
    pauseTimer();

    if (mode === 'focus') {
      completedSessions++;
      totalCompletedMinutes += Math.floor(totalTime / 60);
      saveStats();

      // 4번째 집중 후 긴 휴식
      if (completedSessions % 4 === 0) {
        mode = 'long';
        totalTime = longBreak;
      } else {
        mode = 'short';
        totalTime = shortBreak;
      }
    } else {
      mode = 'focus';
      totalTime = focusTime;
    }

    currentTime = totalTime;
    updateDisplay();
    updateModeLabel();

    // 알림 소리
    playBeep();
  }

  // 종소리 타입 (기본값)
  let bellType = 'temple';

  // 한국 전통 종소리 (Web Audio 합성)
  function playBell(type) {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      type = type || bellType;

      if (type === 'temple') {
        // 사찰 종: 저음 + 배음, 긴 여운
        playTempleBell(ctx);
      } else if (type === 'moktak') {
        // 목탁: 짧고 탁한 나무 소리 연타
        playMoktak(ctx);
      } else if (type === 'bowl') {
        // 싱잉볼: 맑고 지속적인 하모닉
        playSingingBowl(ctx);
      } else if (type === 'bell') {
        // 풍경: 맑고 높은 금속음
        playWindChime(ctx);
      } else {
        // 전자음
        playBeepSimple(ctx);
      }
    } catch (e) { /* 무시 */ }
  }

  // 사찰 종 — 저음 두 번, 배음 풍부
  function playTempleBell(ctx) {
    const freqs = [110, 165, 220, 330]; // 배음
    const now = ctx.currentTime;
    freqs.forEach((f, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = f;
      osc.connect(gain);
      gain.connect(ctx.destination);
      const vol = 0.25 / (i + 1);
      gain.gain.setValueAtTime(vol, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 4);
      osc.start(now);
      osc.stop(now + 4);
    });
  }

  // 목탁 — 짧은 나무 타격음 3회
  function playMoktak(ctx) {
    for (let i = 0; i < 3; i++) {
      const t = ctx.currentTime + i * 0.25;
      const bufferSize = ctx.sampleRate * 0.15;
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      // 노이즈 + 감쇠
      for (let j = 0; j < bufferSize; j++) {
        data[j] = (Math.random() * 2 - 1) * Math.exp(-j / (bufferSize * 0.15));
      }
      const src = ctx.createBufferSource();
      src.buffer = buffer;
      const filter = ctx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.value = 800;
      filter.Q.value = 3;
      const gain = ctx.createGain();
      gain.gain.value = 0.4;
      src.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);
      src.start(t);
    }
  }

  // 싱잉볼 — 맑고 긴 지속음
  function playSingingBowl(ctx) {
    const now = ctx.currentTime;
    const freqs = [440, 660, 880];
    freqs.forEach((f, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = f;
      // 미세한 비브라토
      const lfo = ctx.createOscillator();
      const lfoGain = ctx.createGain();
      lfo.frequency.value = 5;
      lfoGain.gain.value = 2;
      lfo.connect(lfoGain);
      lfoGain.connect(osc.frequency);
      osc.connect(gain);
      gain.connect(ctx.destination);
      const vol = 0.2 / (i + 1);
      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(vol, now + 0.3);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 5);
      osc.start(now);
      osc.stop(now + 5);
      lfo.start(now);
      lfo.stop(now + 5);
    });
  }

  // 풍경 — 높고 맑은 금속음 연쇄
  function playWindChime(ctx) {
    const freqs = [1320, 1760, 2100];
    freqs.forEach((f, i) => {
      const t = ctx.currentTime + i * 0.15;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = f;
      osc.connect(gain);
      gain.connect(ctx.destination);
      gain.gain.setValueAtTime(0.15, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 1.5);
      osc.start(t);
      osc.stop(t + 1.5);
    });
  }

  // 기본 전자음
  function playBeepSimple(ctx) {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.frequency.value = 800;
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 1);
    osc.start();
    osc.stop(ctx.currentTime + 1);
  }

  // 기존 호출 호환
  function playBeep() { playBell(bellType); }

  // 상태 저장 (주간 기록 포함)
  async function saveStats() {
    try {
      const today = new Date().toDateString();
      // 기존 주간 기록 불러오기
      let weekly = {};
      try {
        const r = await window.storage.get('pomodoro-weekly');
        if (r) weekly = JSON.parse(r.value);
      } catch (e) {}
      weekly[today] = (weekly[today] || 0) + 1;

      await window.storage.set('pomodoro-stats', JSON.stringify({
        date: today,
        count: completedSessions,
        minutes: totalCompletedMinutes,
        bellType: bellType
      }));
      await window.storage.set('pomodoro-weekly', JSON.stringify(weekly));
    } catch (e) { /* 무시 */ }
  }

  async function loadStats() {
    try {
      const result = await window.storage.get('pomodoro-stats');
      if (result) {
        const data = JSON.parse(result.value);
        const today = new Date().toDateString();
        if (data.date === today) {
          completedSessions = data.count || 0;
          totalCompletedMinutes = data.minutes || 0;
        }
        if (data.bellType) {
          bellType = data.bellType;
          const sel = document.getElementById('bellType');
          if (sel) sel.value = bellType;
        }
      }
    } catch (e) { /* 없으면 무시 */ }
  }

  // 주간 차트 그리기
  async function drawWeekChart() {
    const canvas = document.getElementById('weekChart');
    if (!canvas) return;

    // Retina 대응
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);

    const W = rect.width;
    const H = rect.height;
    ctx.clearRect(0, 0, W, H);

    // 최근 7일 데이터
    let weekly = {};
    try {
      const r = await window.storage.get('pomodoro-weekly');
      if (r) weekly = JSON.parse(r.value);
    } catch (e) {}

    const days = [];
    const labels = ['일','월','화','수','목','금','토'];
    const today = new Date();
    for (let i = 6; i >= 0; i--) {
      const d = new Date(today);
      d.setDate(today.getDate() - i);
      days.push({
        label: labels[d.getDay()],
        count: weekly[d.toDateString()] || 0,
        isToday: i === 0
      });
    }

    const maxCount = Math.max(...days.map(d => d.count), 4);
    const padding = { top: 15, bottom: 22, left: 10, right: 10 };
    const chartW = W - padding.left - padding.right;
    const chartH = H - padding.top - padding.bottom;
    const barW = chartW / 7 * 0.6;
    const gap = chartW / 7;

    days.forEach((d, i) => {
      const x = padding.left + i * gap + (gap - barW) / 2;
      const barH = (d.count / maxCount) * chartH;
      const y = padding.top + chartH - barH;

      // 막대
      const grad = ctx.createLinearGradient(0, y, 0, y + barH);
      grad.addColorStop(0, d.isToday ? '#f5d061' : '#c9a961');
      grad.addColorStop(1, d.isToday ? '#c9a961' : '#8a7440');
      ctx.fillStyle = grad;
      ctx.fillRect(x, y, barW, barH);

      // 수치
      if (d.count > 0) {
        ctx.fillStyle = '#f5d061';
        ctx.font = 'bold 11px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(d.count, x + barW/2, y - 4);
      }

      // 요일 라벨
      ctx.fillStyle = d.isToday ? '#f5d061' : '#8a7440';
      ctx.font = d.isToday ? 'bold 11px sans-serif' : '11px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(d.label, x + barW/2, H - 6);
    });

    // 기준선
    ctx.strokeStyle = 'rgba(245, 208, 97, 0.15)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(padding.left, padding.top + chartH);
    ctx.lineTo(W - padding.right, padding.top + chartH);
    ctx.stroke();
  }

  // 버튼 이벤트
  btnPlay.addEventListener('click', startTimer);
  btnPause.addEventListener('click', pauseTimer);
  btnReset.addEventListener('click', resetTimer);

  // 설정 모달
  const settingsModal = document.getElementById('settingsModal');
  document.getElementById('menuSettings').addEventListener('click', () => {
    settingsModal.classList.add('show');
  });
  document.getElementById('closeSettings').addEventListener('click', () => {
    focusTime = parseInt(document.getElementById('focusMin').value) * 60;
    shortBreak = parseInt(document.getElementById('shortMin').value) * 60;
    longBreak = parseInt(document.getElementById('longMin').value) * 60;
    bellType = document.getElementById('bellType').value;

    if (mode === 'focus') { totalTime = focusTime; currentTime = focusTime; }
    else if (mode === 'short') { totalTime = shortBreak; currentTime = shortBreak; }
    else { totalTime = longBreak; currentTime = longBreak; }

    // 종소리 설정 저장
    saveStats();

    updateDisplay();
    settingsModal.classList.remove('show');
  });

  // 종소리 미리듣기
  document.getElementById('testBell').addEventListener('click', () => {
    const selected = document.getElementById('bellType').value;
    playBell(selected);
  });

  // 통계 모달
  const statsModal = document.getElementById('statsModal');
  document.getElementById('menuStats').addEventListener('click', async () => {
    document.getElementById('todayCount').textContent = completedSessions;
    document.getElementById('totalMinutes').textContent = totalCompletedMinutes;
    statsModal.classList.add('show');
    // 모달 표시 후 차트 그리기 (레이아웃이 반영된 후)
    setTimeout(() => drawWeekChart(), 50);
  });
  document.getElementById('closeStats').addEventListener('click', () => {
    statsModal.classList.remove('show');
  });

  // 홈 버튼 — 뽀모도로 시간 프리셋 선택
  const presetModal = document.getElementById('presetModal');
  document.getElementById('menuHome').addEventListener('click', () => {
    // 현재 설정과 일치하는 프리셋에 active 표시
    document.querySelectorAll('.preset-btn').forEach(btn => {
      const f = parseInt(btn.dataset.focus) * 60;
      if (f === focusTime) btn.classList.add('active');
      else btn.classList.remove('active');
    });
    presetModal.classList.add('show');
  });

  document.getElementById('closePreset').addEventListener('click', () => {
    presetModal.classList.remove('show');
  });

  // 프리셋 선택 시 시간 적용
  document.querySelectorAll('.preset-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const f = parseInt(btn.dataset.focus);
      const s = parseInt(btn.dataset.short);
      const l = parseInt(btn.dataset.long);

      focusTime = f * 60;
      shortBreak = s * 60;
      longBreak = l * 60;

      // 설정 모달의 입력값도 동기화
      document.getElementById('focusMin').value = f;
      document.getElementById('shortMin').value = s;
      document.getElementById('longMin').value = l;

      // 타이머 즉시 갱신
      pauseTimer();
      mode = 'focus';
      totalTime = focusTime;
      currentTime = focusTime;
      updateDisplay();
      updateModeLabel();

      saveStats();
      presetModal.classList.remove('show');
    });
  });

  // 다크모드 토글 (족두리 클릭)
  const themeToggle = document.getElementById('themeToggle');

  function applyTheme(isDark) {
    if (isDark) {
      document.body.classList.add('dark-mode');
    } else {
      document.body.classList.remove('dark-mode');
    }
  }

  themeToggle.addEventListener('click', async () => {
    const isDark = !document.body.classList.contains('dark-mode');
    applyTheme(isDark);

    // 족두리 반짝임 효과
    themeToggle.classList.remove('flash');
    void themeToggle.offsetWidth; // 리플로우 강제 (애니메이션 재시작)
    themeToggle.classList.add('flash');

    try {
      await window.storage.set('pomodoro-theme', isDark ? 'dark' : 'light');
    } catch (e) {}
  });

  // 초기화
  (async () => {
    // 테마 먼저 로드
    try {
      const r = await window.storage.get('pomodoro-theme');
      if (r && r.value === 'dark') applyTheme(true);
    } catch (e) {}
    await loadStats();
    updateDisplay();
    updateModeLabel();
  })();

  // Service Worker 등록 (PWA)
  // Claude 미리보기 환경(claudeusercontent.com)에서는 sw.js를 서빙할 수 없어 스킵
  const isClaudePreview = location.hostname.includes('claudeusercontent.com') ||
                          location.hostname.includes('anthropic');
  if ('serviceWorker' in navigator && !isClaudePreview && location.protocol !== 'file:') {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then(reg => console.log('SW 등록 성공:', reg.scope))
        .catch(err => console.log('SW 등록 실패:', err));
    });
  }
</script>
</body>
</html>
