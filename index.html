<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🚀 우주 뽀모도로: 은하 개척</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  :root {
    --space-bg: #050508;
    --card-bg: rgba(255, 255, 255, 0.07);
    --glass-border: rgba(255, 255, 255, 0.1);
    --accent-blue: #4facfe;
    --accent-purple: #9246ff;
    --text-main: #ffffff;
    --text-dim: #a0a0c0;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }

  body {
    background: radial-gradient(circle at top, #1a1a2e 0%, #050508 100%);
    color: var(--text-main);
    font-family: var(--font);
    min-height: 100vh;
    display: flex; justify-content: center;
    padding: 2rem 1rem;
    overflow-x: hidden;
  }

  /* 배경 별 효과 */
  body::before {
    content: "";
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background-image: radial-gradient(white, rgba(255,255,255,0.2) 2px, transparent 40px);
    background-size: 200px 200px;
    opacity: 0.15; z-index: -1;
  }

  .app { width: 100%; max-width: 500px; z-index: 1; }

  .header h1 { 
    font-size: 26px; font-weight: 700; text-align: center;
    background: linear-gradient(to right, #4facfe 0%, #00f2fe 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    margin-bottom: 5px;
  }
  .header p { font-size: 13px; color: var(--text-dim); text-align: center; margin-bottom: 2rem; }

  .card { 
    background: var(--card-bg); 
    backdrop-filter: blur(12px); 
    border: 1px solid var(--glass-border);
    border-radius: 20px; padding: 1.5rem; margin-bottom: 1rem;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  }

  .tabs { 
    display: flex; gap: 5px; background: rgba(0,0,0,0.4); 
    border-radius: 15px; padding: 5px; margin-bottom: 1.5rem;
    border: 1px solid var(--glass-border);
  }
  .tab { 
    flex: 1; padding: 10px; border: none; background: transparent; 
    color: var(--text-dim); cursor: pointer; border-radius: 10px; font-size: 13px;
    transition: all 0.3s ease;
  }
  .tab.active { background: var(--accent-blue); color: #fff; box-shadow: 0 0 15px rgba(79, 172, 254, 0.4); }

  /* Timer Styling */
  .timer-ring { position: relative; width: 220px; height: 220px; margin: 0 auto 2rem; }
  .ring-fill { 
    stroke: var(--accent-blue); stroke-width: 5; fill: none;
    stroke-linecap: round; filter: drop-shadow(0 0 8px var(--accent-blue));
    transition: stroke-dashoffset 1s linear;
  }
  .ring-bg { stroke: rgba(255,255,255,0.05); stroke-width: 5; fill: none; }
  
  .timer-display { font-size: 52px; font-weight: 200; color: #fff; letter-spacing: -1px; }
  .timer-label { font-size: 14px; color: var(--accent-blue); text-transform: uppercase; letter-spacing: 2px; }

  .mode-btns { display: flex; gap: 10px; justify-content: center; margin-bottom: 1.5rem; }
  .mode-btn { 
    padding: 8px 16px; border-radius: 20px; border: 1px solid var(--glass-border);
    background: transparent; color: var(--text-dim); cursor: pointer; font-size: 12px;
  }
  .mode-btn.active { border-color: var(--accent-blue); color: #fff; background: rgba(79,172,254,0.1); }

  .ctrl-btn { 
    padding: 12px 35px; border-radius: 12px; border: none;
    font-weight: 600; cursor: pointer; transition: all 0.3s;
  }
  .ctrl-btn.primary { 
    background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
    color: white; box-shadow: 0 4px 15px rgba(146, 70, 255, 0.3);
  }
  .ctrl-btn:hover { transform: translateY(-2px); opacity: 0.9; }

  /* Planet Progress */
  .plant-stage-area { 
    background: rgba(255,255,255,0.03); border-radius: 15px; padding: 1.2rem;
    display: flex; align-items: center; gap: 20px; border: 1px solid var(--glass-border);
  }
  .grow-bar-wrap { height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; margin: 8px 0; }
  .grow-bar { height: 100%; background: var(--accent-blue); box-shadow: 0 0 10px var(--accent-blue); }

  .metric { background: rgba(0,0,0,0.2); border: 1px solid var(--glass-border); }
  
  /* Heatmap */
  .heat-cell { border-radius: 2px; }
  
  .view { display: none; animation: fadeIn 0.4s ease-out; }
  .view.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  /* Collection Grid */
  .col-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .plant-card { 
    background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border);
    border-radius: 15px; padding: 15px 5px; transition: all 0.3s;
  }
  .plant-card.selected { border-color: var(--accent-blue); background: rgba(79,172,254,0.05); }
  .rarity-badge { background: rgba(0,0,0,0.5); font-size: 9px; padding: 2px 6px; border-radius: 10px; }

  /* Galaxy View */
  .forest-wrap { 
    background: #000 url('https://www.transparenttextures.com/patterns/stardust.png'); 
    border-radius: 20px; height: 250px; border: 1px solid var(--glass-border);
  }
</style>
</head>
<body>
  <div class="app">
    <div class="header">
      <h1>🚀 우주 뽀모도로</h1>
      <p>집중한 시간만큼 당신의 은하가 빛납니다</p>
    </div>
    
    </div>

  <script>

</body>
</html>
